<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="watchBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="dialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#watchBg)" rx="24"/>
  <!-- Top Strap -->
  <rect x="160" y="30" width="80" height="110" rx="14" fill="url(#strapGrad)"/>
  <!-- Bottom Strap -->
  <rect x="160" y="260" width="80" height="110" rx="14" fill="url(#strapGrad)"/>
  <rect x="185" y="330" width="30" height="12" rx="4" fill="#64748B"/>
  <!-- Watch Case (Squircle) -->
  <rect x="130" y="115" width="140" height="170" rx="38" fill="#475569" stroke="#94A3B8" stroke-width="4"/>
  <!-- Watch Crown Button -->
  <rect x="270" y="155" width="10" height="30" rx="4" fill="#94A3B8"/>
  <!-- OLED Screen -->
  <rect x="140" y="125" width="120" height="150" rx="30" fill="url(#dialGrad)"/>
  <!-- Activity Ring / Circular Graphic -->
  <circle cx="200" cy="180" r="38" fill="none" stroke="#334155" stroke-width="6"/>
  <circle cx="200" cy="180" r="38" fill="none" stroke="#10B981" stroke-width="6" stroke-dasharray="160 80" stroke-linecap="round"/>
  <circle cx="200" cy="180" r="28" fill="none" stroke="#06B6D4" stroke-width="5" stroke-dasharray="110 70" stroke-linecap="round"/>
  <!-- Time & Heart rate Display -->
  <text x="200" y="186" font-family="sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">10:08</text>
  <path d="M190 235 C190 227, 200 225, 200 232 C200 225, 210 227, 210 235 C210 242, 200 248, 200 248 C200 248, 190 242, 190 235 Z" fill="#EF4444"/>
  <text x="200" y="262" font-family="sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">72 BPM • 9,420</text>
</svg>
