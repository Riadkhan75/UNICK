<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ebBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#ebBg)" rx="24"/>
  <!-- Charging Case -->
  <rect x="120" y="160" width="160" height="130" rx="40" fill="url(#caseGrad)" stroke="#CBD5E1" stroke-width="4"/>
  <!-- Case lid line -->
  <line x1="120" y1="210" x2="280" y2="210" stroke="#94A3B8" stroke-width="3"/>
  <rect x="180" y="206" width="40" height="8" rx="4" fill="#64748B"/>
  <!-- LED Indicator -->
  <circle cx="200" cy="245" r="5" fill="#10B981"/>
  <!-- Left Earbud floating -->
  <g transform="translate(100, 75) rotate(-15)">
    <circle cx="40" cy="40" r="26" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <rect x="33" y="55" width="14" height="48" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <circle cx="40" cy="40" r="14" fill="#3B82F6" opacity="0.8"/>
  </g>
  <!-- Right Earbud floating -->
  <g transform="translate(240, 70) rotate(15)">
    <circle cx="40" cy="40" r="26" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <rect x="33" y="55" width="14" height="48" rx="7" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
    <circle cx="40" cy="40" r="14" fill="#3B82F6" opacity="0.8"/>
  </g>
</svg>
