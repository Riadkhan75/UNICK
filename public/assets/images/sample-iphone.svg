<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EEF2F6" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#phoneBg)" rx="24"/>
  <!-- Phone Frame -->
  <rect x="125" y="45" width="150" height="310" rx="34" fill="url(#bodyGrad)" stroke="#94A3B8" stroke-width="4"/>
  <!-- Screen -->
  <rect x="133" y="53" width="134" height="294" rx="28" fill="url(#screenGrad)"/>
  <!-- Dynamic Island -->
  <rect x="175" y="65" width="50" height="15" rx="7.5" fill="#000000"/>
  <!-- Wallpaper Art -->
  <circle cx="200" cy="200" r="45" fill="#EC4899" opacity="0.8"/>
  <circle cx="225" cy="180" r="35" fill="#8B5CF6" opacity="0.8"/>
  <!-- Screen Clock text -->
  <text x="200" y="125" font-family="sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">09:41</text>
  <text x="200" y="142" font-family="sans-serif" font-size="10" font-weight="500" fill="#CBD5E1" text-anchor="middle">Tuesday, Sep 22</text>
  <!-- Home Indicator bar -->
  <rect x="170" y="334" width="60" height="4" rx="2" fill="#FFFFFF"/>
</svg>
